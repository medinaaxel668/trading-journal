<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Importar Backup</title>
</head>
<body style="background:#111;color:#eee;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;flex-direction:column;gap:20px;padding:20px">
  <div style="text-align:center;max-width:680px;padding:36px;background:#1a1a2e;border-radius:12px;border:1px solid #333">
    <h1>Importar backup</h1>
    <p style="color:#aaa;font-size:.95rem;margin-bottom:20px">
      Selecciona el archivo JSON exportado desde el otro equipo. Se fusiona con tus datos actuales y evita duplicados por ID.
    </p>
    <input type="file" id="file-input" accept=".json,application/json" style="margin-bottom:16px;color:#eee">
    <br>
    <button id="btn-import" style="background:#4caf50;color:#fff;border:none;padding:14px 32px;border-radius:8px;font-size:1.05rem;cursor:pointer;display:none">
      Importar backup
    </button>
    <div id="status" style="margin-top:20px;font-size:.9rem;color:#aaa;text-align:left;max-height:400px;overflow-y:auto"></div>
  </div>

  <script type="module">
    import { initDB, getDB } from './db.js';

    const APP_STORES = ['trades', 'notes', 'liveTrades', 'liveNotes', 'strategies', 'strategyTags'];
    const STORE_MAP = {
      trades: 'trades',
      notes: 'notes',
      liveTrades: 'liveTrades',
      liveNotes: 'liveNotes',
      strategies: 'strategies',
      strategyTags: 'strategyTags',
      '$trades': 'trades',
      '$notes': 'notes',
      '$liveTrades': 'liveTrades',
      '$liveNotes': 'liveNotes',
      '$strategies': 'strategies',
      '$strategyTags': 'strategyTags'
    };

    const fileInput = document.getElementById('file-input');
    const btnImport = document.getElementById('btn-import');
    const status = document.getElementById('status');

    function log(message, color = '#aaa') {
      status.innerHTML += `<div style="color:${color};margin:3px 0">${message}</div>`;
      status.scrollTop = status.scrollHeight;
    }

    function normalizeBackup(raw) {
      const parsed = JSON.parse(raw);
      const sourceStores = parsed.stores && typeof parsed.stores === 'object' ? parsed.stores : parsed;
      const stores = Object.fromEntries(APP_STORES.map(name => [name, []]));

      for (const [sourceName, items] of Object.entries(sourceStores)) {
        const targetName = STORE_MAP[sourceName];
        if (!targetName || !Array.isArray(items)) continue;
        stores[targetName].push(...items);
      }

      for (const store of APP_STORES) {
        const byId = new Map();
        for (const item of stores[store]) {
          if (!item || !item.id) continue;
          const clean = { ...item };
          delete clean['#'];
          byId.set(clean.id, clean);
        }
        stores[store] = [...byId.values()];
      }

      return {
        stores,
        localStorage: parsed.localStorage && typeof parsed.localStorage === 'object' ? parsed.localStorage : {}
      };
    }

    // Las imágenes subidas viajan en el backup como { __blob, type, data }
    // (base64). Se reviven como Blob recién al guardar en IndexedDB.
    function reviveBlob(marker) {
      if (!marker || marker.__blob !== true || typeof marker.data !== 'string') return marker;
      const bin = atob(marker.data);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new Blob([bytes], { type: marker.type || 'image/png' });
    }

    function reviveItemBlobs(item) {
      const out = { ...item };
      for (const field of ['tradingViewBlob', 'imageM3Blob', 'imageM15Blob']) {
        if (out[field] && out[field].__blob) out[field] = reviveBlob(out[field]);
      }
      if (Array.isArray(out.extraImages)) {
        out.extraImages = out.extraImages.map(x => (x && x.blob && x.blob.__blob) ? { ...x, blob: reviveBlob(x.blob) } : x);
      }
      return out;
    }

    let pendingBackup = null;

    fileInput.addEventListener('change', event => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = readerEvent => {
        status.innerHTML = '';
        try {
          const backup = normalizeBackup(readerEvent.target.result);
          const counts = APP_STORES.map(store => `${store}: ${backup.stores[store].length}`).join(' | ');
          const total = APP_STORES.reduce((sum, store) => sum + backup.stores[store].length, 0);
          log(`Archivo listo: ${total} registros.`);
          log(counts);
          pendingBackup = backup;
          btnImport.style.display = 'inline-block';
        } catch (error) {
          log(`Error leyendo el archivo: ${error.message}`, '#f44336');
          btnImport.style.display = 'none';
        }
      };
      reader.readAsText(file);
    });

    btnImport.onclick = async () => {
      const backup = pendingBackup || { stores: {}, localStorage: {} };
      btnImport.disabled = true;
      btnImport.textContent = 'Importando...';

      try {
        await initDB();
        const db = getDB();
        log(`Importando en la base activa: ${db.name}`, '#ddd');

        let inserted = 0;
        let updated = 0;
        await db.transaction('rw', APP_STORES, async () => {
          for (const store of APP_STORES) {
            const table = db.table(store);
            const items = backup.stores[store] || [];
            let storeInserted = 0;
            let storeUpdated = 0;

            for (const item of items) {
              const exists = await table.get(item.id);
              await table.put(reviveItemBlobs(item));
              if (exists) storeUpdated++;
              else storeInserted++;
            }

            inserted += storeInserted;
            updated += storeUpdated;
            log(`${store}: ${storeInserted} nuevos, ${storeUpdated} actualizados`, '#4caf50');
          }
        });

        for (const [key, value] of Object.entries(backup.localStorage || {})) {
          if (key.startsWith('journal_')) localStorage.setItem(key, value);
        }

        log('━━━━━━━━━━━━━━━━━━━━━', '#777');
        log(`Importación completa: ${inserted} nuevos, ${updated} actualizados.`, '#4caf50');
        log('Vuelve a abrir la app para ver los datos actualizados.', '#aaa');
        btnImport.textContent = 'Importado';
      } catch (error) {
        log(`Error importando: ${error.message}`, '#f44336');
        btnImport.textContent = 'Importar backup';
        btnImport.disabled = false;
      }
    };
  </script>
</body>
</html>
